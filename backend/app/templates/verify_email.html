<!doctype html>
<html><body style="margin:0;background:#f7f3ea;font-family:Arial,sans-serif;color:#181211">
  <div style="max-width:560px;margin:32px auto;padding:32px;background:#ffffff;border-radius:16px;border:1px solid #e5dfd2">
    <h1 style="margin:0 0 12px">Verify your LegalLens email</h1>
    <p>Hi {{ name }}, enter this code in LegalLens to activate your account:</p>
    <p style="margin:28px 0;padding:16px;text-align:center;background:#eae6db;border-radius:12px;font-size:28px;font-weight:700;letter-spacing:8px">{{ verification_code }}</p>
    <p style="color:#526174">This code expires in 15 minutes. If you did not create an account, you can ignore this email.</p>
  </div>
</body></html>
